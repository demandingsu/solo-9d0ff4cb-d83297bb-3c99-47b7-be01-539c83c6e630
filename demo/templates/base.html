<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}采购公告示范站{% endblock %}</title>
<style>
  :root { --ink:#17232e; --muted:#5c6b78; --line:#d7dee5; --accent:#1d5d8f;
          --bg:#f6f8fa; --warn:#9a4b00; --danger:#a32020; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.65 "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
         color:var(--ink); background:var(--bg); }
  header.site { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; }
  header.site .wrap { max-width:980px; margin:0 auto; display:flex; gap:16px;
                      align-items:baseline; flex-wrap:wrap; }
  header.site strong { font-size:17px; }
  header.site .tag { font-size:12px; color:var(--warn); border:1px solid currentColor;
                     padding:1px 7px; border-radius:999px; }
  main { max-width:980px; margin:26px auto 64px; padding:0 24px; }
  h1 { font-size:23px; margin:0 0 6px; }
  h2 { font-size:17px; margin:34px 0 12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:20px 22px; margin:16px 0; }
  .meta { color:var(--muted); font-size:13.5px; }
  .notice-list a { color:var(--accent); text-decoration:none; font-weight:600; }
  .notice-list li { margin:10px 0; }
  .pill { display:inline-block; font-size:12px; border-radius:999px; padding:1px 8px;
          border:1px solid var(--line); color:var(--muted); }
  .pill.retracted { color:var(--danger); border-color:currentColor; }
  label { display:block; font-weight:600; margin:14px 0 4px; }
  input[type=text], input[type=number], textarea {
      width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
      font:inherit; background:#fff; }
  textarea { min-height:150px; resize:vertical; }
  button { font:inherit; padding:8px 16px; border-radius:6px; cursor:pointer;
           border:1px solid var(--accent); background:var(--accent); color:#fff; }
  button.secondary { background:#fff; color:var(--ink); border-color:var(--line); }
  button.danger { background:#fff; color:var(--danger); border-color:var(--danger); }
  .row { display:flex; gap:24px; flex-wrap:wrap; }
  .row > form { flex:1 1 300px; }
  .banner { border-radius:8px; padding:10px 14px; margin:0 0 18px; font-size:14px;
            background:#e8f3ea; border:1px solid #b6d7bd; }
  .banner.warn { background:#fdf3e6; border-color:#e7c79a; }
  .banner.err { background:#fbeaea; border-color:#e3b4b4; }
  pre.body { white-space:pre-wrap; font:inherit; background:var(--bg);
             padding:14px 16px; border-radius:8px; border:1px solid var(--line); }
  .retracted-note { color:var(--danger); font-weight:600; }
  footer { color:var(--muted); font-size:12.5px; text-align:center; padding:24px; }
  .demo-box { border-style:dashed; }
  .demo-box h2 { margin-top:0; font-size:15px; color:var(--warn); }
  .checks { font-size:13.5px; color:var(--muted); }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <strong>市政采购公告示范站</strong>
    <span class="tag">本地演示 · 可改稿/换附件/撤稿</span>
    <a href="/" style="margin-left:auto;color:var(--accent);text-decoration:none;">公告列表</a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>仅供本地档案采集演示，非真实采购平台。</footer>
</body>
</html>
